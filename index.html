<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
  />
  <title>片語快刷 · SceneCard</title>
  <meta name="description" content="極簡、零壓力、單手爽刷的歐美劇情英文片語刷卡 App" />
  <meta name="theme-color" content="#0E1117" />
  <meta name="color-scheme" content="dark" />

  <!-- iOS PWA Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="片語快刷" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />

  <!-- PWA Manifest & Favicons -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Progress Header -->
    <header class="top-bar">
      <div class="progress-group" aria-live="polite">
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="progress-label" class="progress-label">1 / 10</span>
      </div>

      <button
        id="menu-btn"
        class="icon-btn"
        type="button"
        aria-label="設定與安裝說明"
        aria-haspopup="dialog"
        aria-expanded="false"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="5" cy="12" r="1.8" fill="currentColor" />
          <circle cx="12" cy="12" r="1.8" fill="currentColor" />
          <circle cx="19" cy="12" r="1.8" fill="currentColor" />
        </svg>
      </button>
    </header>

    <!-- Main Study View -->
    <main id="study-view" class="study-view">
      <div class="deck-stage" id="deck-stage">
        <!-- Next card peeking underneath -->
        <div id="next-card-ghost" class="flashcard flashcard--ghost" aria-hidden="true">
          <div class="card-header">
            <span id="ghost-category" class="category-badge"></span>
          </div>
          <p id="ghost-sentence" class="sentence-text sentence-text--ghost"></p>
        </div>

        <!-- Active interactive flashcard -->
        <article
          id="active-card"
          class="flashcard flashcard--active"
          tabindex="0"
          role="button"
          aria-expanded="false"
          aria-label="點擊展開片語解析，左滑卡住了，右滑秒懂"
        >
          <!-- Swipe decision stamps -->
          <div class="swipe-stamp swipe-stamp--known" id="stamp-known" aria-hidden="true">秒懂</div>
          <div class="swipe-stamp swipe-stamp--stuck" id="stamp-stuck" aria-hidden="true">卡住了</div>

          <div class="card-scroll-inner">
            <div class="card-header">
              <span id="card-category" class="category-badge">旁白・動作</span>

              <button
                id="audio-btn"
                class="audio-btn"
                type="button"
                aria-label="朗讀英文例句"
                title="朗讀例句"
              >
                <svg class="audio-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="M11 5L6 9H3V15H6L11 19V5Z"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    class="wave wave-1"
                    d="M15.54 8.46C16.4774 9.39764 17.004 10.6692 17.004 11.995C17.004 13.3208 16.4774 14.5924 15.54 15.53"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    class="wave wave-2"
                    d="M19.07 4.93C20.9447 6.80528 21.9979 9.34836 21.9979 12C21.9979 14.6516 20.9447 17.1947 19.07 19.07"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <span class="audio-btn-text">發音</span>
              </button>
            </div>

            <!-- Front: Sentence with highlighted target phrase -->
            <div class="card-front">
              <p id="card-sentence" class="sentence-text"></p>
            </div>

            <!-- Tap hint before reveal -->
            <div id="reveal-hint" class="reveal-hint" aria-hidden="true">
              <span>輕點卡片查看解析</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                <path
                  d="M6 9L12 15L18 9"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>

            <!-- Back / Expanded explanation section -->
            <div id="card-back" class="card-back" aria-hidden="true">
              <div class="card-back-inner">
                <hr class="card-divider" />

                <div class="meaning-block">
                  <div id="card-phrase" class="phrase-title"></div>
                  <p id="card-meaning" class="phrase-meaning"></p>
                </div>

                <div class="translation-block">
                  <span class="field-label">白話翻譯</span>
                  <p id="card-translation" class="sentence-translation"></p>
                </div>

                <div class="note-block">
                  <span class="field-label">語感備註</span>
                  <p id="card-note" class="phrase-note"></p>
                </div>
              </div>
            </div>
          </div>
        </article>
      </div>

      <!-- Bottom Action Controls: Strictly Two Big Thumb Buttons -->
      <footer class="action-bar">
        <button id="btn-stuck" class="action-btn action-btn--stuck" type="button">
          <span class="action-btn-main">卡住了</span>
          <span id="hint-stuck" class="action-btn-sub">明天再見</span>
        </button>

        <button id="btn-known" class="action-btn action-btn--known" type="button">
          <span class="action-btn-main">秒懂</span>
          <span id="hint-known" class="action-btn-sub">1 天後</span>
        </button>
      </footer>
    </main>

    <!-- Completion Celebration View -->
    <section id="complete-view" class="complete-view" hidden aria-live="polite">
      <div class="complete-card">
        <div class="complete-emblem" aria-hidden="true">
          <div class="emblem-glow"></div>
          <svg class="emblem-check" width="44" height="44" viewBox="0 0 24 24" fill="none">
            <path
              d="M5 13L9.5 17.5L19 7.5"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>

        <h1 id="complete-title" class="complete-title">今日份 10 張完成！</h1>
        <p id="complete-subtitle" class="complete-subtitle">剛好就好，明天再輕鬆刷一輪。</p>

        <div id="complete-stats" class="complete-stats">
          <div class="stat-pill stat-pill--known">
            <span class="stat-dot"></span>
            <span>秒懂 <strong id="stat-known">0</strong></span>
          </div>
          <div class="stat-pill stat-pill--stuck">
            <span class="stat-dot"></span>
            <span>卡住了 <strong id="stat-stuck">0</strong></span>
          </div>
        </div>

        <button id="btn-extra" class="extra-btn" type="button">
          <span>再來 5 張</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M5 12H19M13 6L19 12L13 18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </section>
  </div>

  <!-- Minimal Settings / Install Sheet -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-header">
        <h2 id="sheet-title" class="sheet-title">片語快刷 · SceneCard</h2>
        <button id="sheet-close" class="icon-btn" type="button" aria-label="關閉">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M18 6L6 18M6 6L18 18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>

      <div class="sheet-body">
        <div class="sheet-section">
          <div class="sheet-row">
            <span class="sheet-label">已探索題庫</span>
            <span id="explored-label" class="sheet-value">0 / 50 組</span>
          </div>
          <div class="mini-track">
            <div id="explored-fill" class="mini-fill"></div>
          </div>
        </div>

        <div class="sheet-section">
          <div class="sheet-row">
            <span class="sheet-label">朗讀語速</span>
            <div class="segmented" role="group" aria-label="朗讀語速">
              <button type="button" class="seg-btn" data-rate="0.82">慢速</button>
              <button type="button" class="seg-btn" data-rate="0.96">標準</button>
            </div>
          </div>
        </div>

        <div class="sheet-section">
          <span class="sheet-label">安裝到手機桌面（支援離線）</span>
          <button id="btn-install-pwa" class="install-btn" type="button" hidden>
            立即安裝到桌面
          </button>
          <p id="install-guide" class="sheet-hint">
            iOS Safari：點底部「分享」→「加入主畫面」<br />
            Android Chrome：點右上角選單 →「安裝應用程式」
          </p>
        </div>

        <div class="sheet-section sheet-section--footer">
          <button id="btn-reset" class="reset-btn" type="button">重置學習進度</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Quiet Toast for subtle status feedback -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
